<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
<title id="title">Slede begrenzen langs lokale Z</title><desc id="desc">De hand kan naast en voorbij de rail bewegen. Alleen haar lokale Z-afstand vanaf de rustpositie wordt behouden en begrensd tussen nul en zeven en een halve centimeter. Een drempel activeert eenmaal.</desc>
<rect width="800" height="280" fill="#f8fafc"/><g font-family="sans-serif" font-size="18" fill="#172033"><text x="30" y="35">Meten in pivotruimte, begrenzen op de lokale rail</text><line x1="100" y1="150" x2="660" y2="150" stroke="#334155" stroke-width="5"/><line x1="100" y1="130" x2="100" y2="170" stroke="#334155" stroke-width="3"/><line x1="600" y1="120" x2="600" y2="180" stroke="#c2410c" stroke-width="3"/><text x="75" y="210">0 cm</text><text x="555" y="210">7,5 cm</text><text x="650" y="155">+Z</text><circle cx="690" cy="75" r="10" fill="#2563eb"/><text x="570" y="60">Hand / handle</text><path d="M690 90 V150 H600" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/><rect x="540" y="133" width="60" height="34" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/><text x="230" y="245">Slede stopt op de grens; handpositie mag verder gaan.</text></g></svg>
