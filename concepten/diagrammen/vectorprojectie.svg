<svg xmlns="http://www.w3.org/2000/svg" width="660" height="365" viewBox="0 0 660 365" role="img" aria-labelledby="title desc"><title id="title">Vectorprojectie</title><desc id="desc">Een vector met X component 3 en Z component 4 wordt opgesplitst in een vector langs X en een langs Z. Beide projecties staan nog in wereldruimte.</desc><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><style>text{font-family:DejaVu Sans,sans-serif;font-size:16px;fill:#172b4d}.title{font-size:21px;font-weight:bold}.small{font-size:14px}.world{stroke:#2563eb}.local{stroke:#c2410c}.dash{stroke-dasharray:6 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="24" y="34" class="title">Een vector en zijn loodrechte componenten</text><line x1="90" y1="85" x2="410" y2="85" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="90" y1="85" x2="90" y2="295" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="417" y="90" class="">+X</text><text x="43" y="305" class="">+Z</text><line x1="90" y1="85" x2="225" y2="85" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="90" y1="85" x2="90" y2="265" stroke="#047857" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="90" y1="85" x2="225" y2="265" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="225" y1="85" x2="225" y2="265" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="90" y1="265" x2="225" y2="265" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5"/><text x="145" y="69" class="">3</text><text x="65" y="180" class="">4</text><circle cx="225" cy="265" r="5" fill="#7c3aed"/><text x="293" y="240" class="">v = (3, 0, 4)</text><text x="293" y="268" class="">lengte = 5</text><text x="24" y="337" class="small">De projecties blijven vectoren in hetzelfde coördinatenstelsel.</text></svg>
