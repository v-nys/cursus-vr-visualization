<svg xmlns="http://www.w3.org/2000/svg" width="660" height="370" viewBox="0 0 660 370" role="img" aria-labelledby="title desc"><title id="title">Lokale en globale ruimte</title><desc id="desc">Een parent op wereld X 3, Z 1 heeft een rotatie van min 90 graden rond Y. Een lokaal punt X 1, Z 0 staat daardoor op wereld X 3, Z 2.</desc><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><style>text{font-family:DejaVu Sans,sans-serif;font-size:16px;fill:#172b4d}.title{font-size:21px;font-weight:bold}.small{font-size:14px}.world{stroke:#2563eb}.local{stroke:#c2410c}.dash{stroke-dasharray:6 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="24" y="34" class="title">Hetzelfde punt, twee coördinatenstelsels</text><line x1="90" y1="80" x2="440" y2="80" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="90" y1="80" x2="90" y2="290" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="445" y="85" class="">wereld +X</text><text x="22" y="308" class="">wereld +Z</text><circle cx="90" cy="80" r="5" fill="#172b4d"/><text x="25" y="67" class="">wereld O</text><line x1="270" y1="140" x2="270" y2="270" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="270" y1="140" x2="150" y2="140" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="270" cy="140" r="5" fill="#c2410c"/><text x="285" y="140" class="">parent (3, 1)</text><text x="283" y="273" class="">lokaal +X</text><text x="147" y="126" class="">lokaal +Z</text><circle cx="270" cy="200" r="7" fill="#047857"/><line x1="90" y1="200" x2="270" y2="200" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5"/><text x="290" y="204" class="">P: lokaal (1, 0)</text><text x="290" y="229" class="">P: wereld (3, 2)</text><text x="24" y="343" class="small">Bovenaanzicht: alleen X en Z. Parentrotatie rond Y = -90°.</text></svg>
