<svg xmlns="http://www.w3.org/2000/svg" width="690" height="310" viewBox="0 0 690 310" role="img" aria-labelledby="title desc"><title id="title">Reverse Z diepte</title><desc id="desc">De nabije kant heeft diepte 1 en de verre kant diepte 0. De pijl geeft de afstandsrichting weer en geen lineaire schaal van depthwaarden.</desc><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><style>text{font-family:DejaVu Sans,sans-serif;font-size:16px;fill:#172b4d}.title{font-size:21px;font-weight:bold}.small{font-size:14px}.world{stroke:#2563eb}.local{stroke:#c2410c}.dash{stroke-dasharray:6 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="24" y="34" class="title">Reverse Z keert de diepteconventie om</text><line x1="130" y1="135" x2="540" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="130" y1="75" x2="130" y2="195" stroke="#047857" stroke-width="2.5"/><line x1="540" y1="75" x2="540" y2="195" stroke="#c2410c" stroke-width="2.5"/><text x="80" y="66" class="">near plane</text><text x="490" y="66" class="">far plane</text><text x="98" y="228" class="">depth = 1</text><text x="508" y="228" class="">depth = 0</text><text x="220" y="120" class="">Verder van de camera</text><text x="24" y="280" class="small">De afstand groeit naar rechts; depthwaarden zijn niet lineair in meters.</text></svg>
