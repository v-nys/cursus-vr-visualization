<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
<title id="title">Voorwerp en lokaal grijppunt uitlijnen</title><desc id="desc">Een voorwerp heeft een grijppunt rechts van zijn oorsprong. Om dat punt op de hand te laten aansluiten, ligt de oorsprong links van de hand. De relatie is O maal G is H.</desc>
<rect width="800" height="260" fill="#f8fafc"/><g font-family="sans-serif" font-size="18" fill="#172033"><text x="30" y="35">Grijppunt G is lokaal ten opzichte van voorwerp O</text><rect x="70" y="80" width="200" height="100" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="110" cy="130" r="7" fill="#2563eb"/><text x="80" y="210">O: oorsprong</text><line x1="110" y1="130" x2="270" y2="130" stroke="#2563eb" stroke-width="3"/><circle cx="270" cy="130" r="9" fill="#c2410c"/><text x="200" y="70">G: aansluiting</text><text x="330" y="135">→ uitlijnen →</text><rect x="515" y="80" width="200" height="100" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="555" cy="130" r="7" fill="#2563eb"/><circle cx="715" cy="130" r="10" fill="#c2410c"/><text x="600" y="70">H: hand / houder</text><text x="470" y="220">O × G = H → O = H × inverse(G)</text></g></svg>
