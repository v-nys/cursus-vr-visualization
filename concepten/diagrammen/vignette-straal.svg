<svg xmlns="http://www.w3.org/2000/svg" width="740" height="455" viewBox="0 0 740 455" role="img" aria-labelledby="title desc"><title id="title">De straal van een vignette</title><desc id="desc">Een cirkel met straal 1 raakt het midden van de randen van een vierkant van min 1 tot plus 1. Een cirkel met straal wortel 2 omvat ook de hoeken.</desc><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><style>text{font-family:DejaVu Sans,sans-serif;font-size:16px;fill:#172b4d}.title{font-size:21px;font-weight:bold}.small{font-size:14px}.world{stroke:#2563eb}.local{stroke:#c2410c}.dash{stroke-dasharray:6 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="24" y="34" class="title">Waarom de hoeken verder liggen dan de randen</text><circle cx="245" cy="225" r="148.492" fill="#dcfce7" stroke="#047857" stroke-width="2"/><rect x="140" y="120" width="210" height="210" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="245" cy="225" r="105" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 5"/><line x1="245" y1="225" x2="350" y2="120" stroke="#047857" stroke-width="2.5"/><line x1="245" y1="225" x2="350" y2="225" stroke="#c2410c" stroke-width="2.5"/><circle cx="245" cy="225" r="5" fill="#172b4d"/><circle cx="350" cy="120" r="5" fill="#047857"/><text x="358" y="112" class="">(1, 1)</text><text x="200" y="250" class="">(0, 0)</text><text x="450" y="145" class="">Blauw: clipvierkant</text><text x="450" y="185" class="">Oranje: straal 1</text><text x="450" y="225" class="">Groen: straal √2</text><text x="450" y="275" class="">√(1² + 1²) ≈ 1,414</text><text x="24" y="425" class="small">De cirkel met straal 1 bereikt de randmiddens, maar niet de vier hoeken.</text></svg>
