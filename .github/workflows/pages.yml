name: Publiceer cursus op GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configureer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Stel het siteadres in
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          path = Path('_config.yml')
          config = path.read_text()
          for key, value in [('url', os.environ['PAGES_ORIGIN']), ('baseurl', os.environ['PAGES_BASE_PATH'])]:
              config = re.sub(rf'^{key}:.*$', lambda match: f'{key}: {json.dumps(value)}', config, flags=re.MULTILINE)
          path.write_text(config)
          PY
      - name: Bouw de Jekyll-site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Controleer interne verwijzingen
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/check_site.py _site --baseurl "$PAGES_BASE_PATH"
      - name: Bewaar de Pages-site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceer
        id: deployment
        uses: actions/deploy-pages@v4
